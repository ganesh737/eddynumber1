name: Build macOS Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-mac:
    runs-on: macos-14 # Guarantees Apple Silicon (M-series) runner

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Sync Shader Sources
        run: node scripts/sync-shader-sources.mjs

      - name: Build macOS App
        run: npm run desktop:dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Mac DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Installer
          path: |
            dist/*.dmg
            dist/*.zip