name: Build macOS Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-mac:
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Sync Shader Sources (If script exists)
        run: |
          if [ -f "scripts/sync-shader-sources.mjs" ]; then
            node scripts/sync-shader-sources.mjs
          else
            echo "sync-shader-sources.mjs not found, skipping..."
          fi

      - name: Build macOS App
        run: npx vite build --config config/vite.config.ts && npx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Mac DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Installer
          path: |
            dist/*.dmg
            dist/*.zip