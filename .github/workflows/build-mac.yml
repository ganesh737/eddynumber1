name: Build macOS Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-mac:
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Whisper CLI Binaries
        id: cache-whisper
        uses: actions/cache@v4
        with:
          path: public/whisper-cli/darwin-arm64
          key: whisper-cli-darwin-arm64-${{ hashFiles('package-lock.json') }}

      - name: Install Dependencies
        run: npm install

      - name: Remove problematic dmgbuild cache
        run: rm -rf ~/Library/Caches/electron-builder

      - name: Sync Shader Sources (If script exists)
        run: |
          if [ -f "scripts/sync-shader-sources.mjs" ]; then
            node scripts/sync-shader-sources.mjs
          else
            echo "sync-shader-sources.mjs not found, skipping..."
          fi

      - name: Build macOS App
        run: npm run desktop:dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache

      - name: Upload Mac Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Installer
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.pkg